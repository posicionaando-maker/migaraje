<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi Garaje | Hallazgos únicos en Cuba</title>
  
  <!-- METATAGS (sin cambios) -->
  <meta name="description" content="Mi Garaje - Venta de hallazgos únicos en Cuba. Muebles restaurados, electrónica vintage, decoración. Envíos a toda la isla. Contacta por WhatsApp.">
  <meta name="keywords" content="venta de garaje Cuba, muebles vintage, electrónica antigua, decoración Cuba, hallazgos únicos">
  <meta name="author" content="Mi Garaje">
  <meta property="og:title" content="Mi Garaje | Hallazgos únicos en Cuba">
  <meta property="og:description" content="Productos únicos, restaurados y con historia. Consulta por WhatsApp.">
  <meta property="og:image" content="https://posicionaando-maker.github.io/migaraje/images/logo-preview.jpg">
  <meta property="og:url" content="https://posicionaando-maker.github.io/migaraje/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#FF6B35">
  
  <!-- CORREGIDO: RUTAS RELATIVAS (sin la barra '/' al inicio) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ========== CABECERA ========== -->
  <header>
    <div class="header-top">
      <div class="logo-area">
        <h1 id="mainTitle">🏠 Mi Garaje</h1>
        <span class="tagline">Hallazgos únicos en Cuba</span>
      </div>
      <div class="header-buttons">
        <button id="updateBtn" class="icon-btn" aria-label="Actualizar catálogo">🔄</button>
      </div>
    </div>
    
    <!-- BUSCADOR -->
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar en Mi Garaje..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-search" style="display: none;">✖️</button>
      </div>
      <div id="suggestionsList" class="suggestions-list" style="display: none;"></div>
    </div>
    
    <!-- FILTROS -->
    <div class="toolbar">
      <div class="filter-buttons">
        <button id="filterAllBtn" class="filter-btn active">Todos</button>
        <div id="categoriasContainer" class="categorias-dinamicas"></div>
      </div>
      <div class="sort-controls">
        <select id="sortSelect" class="sort-select">
          <option value="fecha">🕒 Más reciente</option>
          <option value="precio-asc">💰 Menor precio</option>
          <option value="precio-desc">💰 Mayor precio</option>
          <option value="nombre">🔤 Nombre A-Z</option>
        </select>
      </div>
    </div>
    
    <div id="resultCount" class="result-count"></div>
  </header>
  
  <!-- ========== MAIN ========== -->
  <main>
    <div id="progressContainer" class="progress-container" style="display: none;">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="progressText" class="progress-text">Cargando catálogo...</div>
    </div>
    
    <!-- Contenedor de productos: ahora usa una lista con tarjetas pequeñas + texto al lado -->
    <div id="productosContainer" class="productos-list">
      <div class="loading">Cargando catálogo...</div>
    </div>
    
    <!-- Paginado visible -->
    <div id="paginationContainer" class="pagination-container">
      <button id="prevPage" class="page-btn" disabled>← Anterior</button>
      <div id="pageNumbers" class="page-numbers"></div>
      <button id="nextPage" class="page-btn" disabled>Siguiente →</button>
    </div>
  </main>
  
  <!-- MODAL ADMIN -->
  <div id="adminModal" class="modal admin-modal">
    <div class="modal-content admin-content">
      <div class="admin-header">
        <h2>📊 Mi Garaje - Panel del Vendedor</h2>
        <span class="close-admin-modal">&times;</span>
      </div>
      <div id="adminStats"></div>
      <button id="copyStatsBtn" class="copy-stats-btn">📋 Copiar al portapapeles</button>
    </div>
  </div>
  
  <!-- NOTIFICACIONES -->
  <div id="updateNotification" class="update-notification" style="display: none;">
    <span>🔄 ¡Hay productos nuevos! ¿Actualizar catálogo?</span>
    <div>
      <button id="confirmUpdate" class="update-yes">Sí, actualizar</button>
      <button id="cancelUpdate" class="update-no">Ahora no</button>
    </div>
  </div>
  
  <div id="offlineMsg" class="offline-msg" style="display: none;">
    ⚠️ Sin conexión · Mostrando productos guardados en tu dispositivo
  </div>
  
  <!-- CORREGIDO: SCRIPTS CON RUTAS RELATIVAS -->
  <script src="js/sw-register.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
